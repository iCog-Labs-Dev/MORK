[package]
name = "mork-server"
version = "0.1.0"
edition = "2024"

[dependencies]
mork = { workspace = true }
mork-expr = { workspace = true }
mork-interning = { workspace = true }
mork-frontend = { workspace = true }
pathmap = { workspace = true }

tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "signal", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

serde = "1"
serde_json = "1"
crc32fast = "1"
clap = { version = "4", features = ["derive"] }
log = { workspace = true }
env_logger = { workspace = true }
